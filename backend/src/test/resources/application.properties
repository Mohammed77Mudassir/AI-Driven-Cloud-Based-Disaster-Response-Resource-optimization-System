# =====================================================================
# Test profile - superset of the main application.properties (this file
# shadows the main one on the test classpath, so it MUST remain a full
# copy plus any test-only overrides).
# =====================================================================

server.port=8080

# --- Database (H2 in-memory, PostgreSQL compatibility mode) ---
spring.datasource.url=jdbc:h2:mem:disasterdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Connection pooling (HikariCP) ---
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=DisasterHikariPool

# --- JPA / Flyway ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway runs V1__init_schema.sql on startup (both H2 and PostgreSQL)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- H2 Console ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- JWT ---
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A47}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.refresh-secret=${JWT_REFRESH_SECRET:}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# --- Security hardening (relaxed for the integration suite) ---
app.security.h2-console-enabled=true
# All MockMvc test requests share the 127.0.0.1 bucket, so raise limits
# well above the number of requests the suite makes per minute.
app.security.login.max-attempts=1000
app.security.login.lockout-minutes=1
app.security.rate-limit.max-per-minute=5000
app.security.rate-limit.public-max-per-minute=5000

# --- File upload limits (attachments) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# --- CORS ---
app.cors.allowed-origins=http://localhost:5173

# --- Weather API (blank = use mock provider) ---
weather.api-key=${OPENWEATHER_API_KEY:}
weather.api-url=${OPENWEATHER_API_URL:https://api.openweathermap.org/data/2.5/weather}

# --- AI providers (blank = local deterministic AI engine) ---
ai.gemini.api-key=${GOOGLE_GEMINI_API_KEY:}
ai.groq.api-key=${GROQ_API_KEY:}

# --- Routing / Route Optimization (blank key = Haversine offline fallback) ---
app.routing.provider=${ROUTING_PROVIDER:openrouteservice}
app.routing.openrouteservice.api-key=${OPENROUTESERVICE_API_KEY:}
app.routing.openrouteservice.url=${OPENROUTESERVICE_API_URL:https://api.openrouteservice.org/v2/directions}
app.routing.openrouteservice.timeout-ms=8000
app.routing.openrouteservice.retry-count=${OPENROUTESERVICE_RETRY_COUNT:2}
app.routing.google.api-key=${GOOGLE_MAPS_API_KEY:}
app.routing.mapbox.access-token=${MAPBOX_ACCESS_TOKEN:}
app.routing.cache.ttl-minutes=10
app.routing.normal-speed-kmph=40
app.routing.emergency-speed-kmph=55

# --- Notification providers (blank = use mock provider) ---
notification.firebase.server-key=${FIREBASE_SERVER_KEY:}
notification.brevo.api-key=${BREVO_API_KEY:}

# --- Mail (blank = use mock provider) ---
spring.mail.host=${MAIL_HOST:}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- Email (Resend REST API; blank API key = mock email provider) ---
email.resend.api-key=${RESEND_API_KEY:}
email.resend.from-email=${RESEND_FROM_EMAIL:}
email.resend.from-name=${RESEND_FROM_NAME:AI Disaster Management System}
email.resend.api-url=${RESEND_API_URL:https://api.resend.com/emails}
email.resend.timeout-ms=${RESEND_TIMEOUT_MS:8000}
email.resend.retry-count=${RESEND_RETRY_COUNT:0}
email.resend.retry-backoff-ms=${RESEND_RETRY_BACKOFF_MS:1}
email.emergency-contact=${EMAIL_EMERGENCY_CONTACT:112}

# --- SMS / Twilio (blank = use mock provider) ---
notification.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
notification.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
notification.twilio.phone-number=${TWILIO_PHONE_NUMBER:}

# --- Hazard data feeds (all optional) ---
app.api.openaq.api-key=${OPENAQ_API_KEY:}
app.api.usgs.api-url=${USGS_API_URL:https://earthquake.usgs.gov/fdsnws/event/1/query}
app.api.nasa-firms.api-key=${NASA_FIRMS_API_KEY:}

# --- Earthquake monitoring (USGS GeoJSON feed) ---
# Test copy: long refresh interval so the scheduled job never fires during the suite.
earthquake.api.url=${USGS_EARTHQUAKE_API:https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson}
earthquake.refresh.interval=${EARTHQUAKE_REFRESH_INTERVAL_MS:600000}
earthquake.cache.minutes=${EARTHQUAKE_CACHE_MINUTES:60}

# --- NASA EONET events (public natural-disaster feed) ---
# Test copy: long refresh interval so the scheduled job never fires during the suite.
eonet.api.url=${NASA_EONET_API:https://eonet.gsfc.nasa.gov/api/v3/events}
eonet.refresh.interval=${EONET_REFRESH_INTERVAL_MS:600000}
eonet.cache.minutes=${EONET_CACHE_MINUTES:60}

# --- Fire monitoring (NASA FIRMS active-fire feed) ---
# Test copy: long refresh interval so the scheduled job never fires during the suite.
fire.api.url=${NASA_FIRMS_API_URL:https://firms.modaps.eosdis.nasa.gov/api/area/csv}
fire.refresh.interval=${FIRE_REFRESH_INTERVAL_MS:600000}
fire.cache.minutes=${FIRE_CACHE_MINUTES:60}
fire.sources=${NASA_FIRMS_SOURCES:VIIRS_SNPP_NRT,MODIS_NRT}
fire.day=${NASA_FIRMS_DAY:1}
fire.day-range=${NASA_FIRMS_DAY_RANGE:1}

# --- Air quality monitoring (OpenAQ latest-measurements feed) ---
# Test copy: long refresh interval so the scheduled job never fires during the suite.
air-quality.api.url=${OPENAQ_API_URL:https://api.openaq.org/v2/latest}
air-quality.refresh.interval=${OPENAQ_REFRESH_INTERVAL_MS:600000}
air-quality.cache.minutes=${OPENAQ_CACHE_MINUTES:60}

# --- SpringDoc / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# --- Logging ---
logging.level.com.disaster=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=INFO
