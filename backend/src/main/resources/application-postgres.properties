# =====================================================================
# Production profile - PostgreSQL
# Activate with:  mvn spring-boot:run -Dspring-boot.run.profiles=postgres
#   (or set environment variable SPRING_PROFILES_ACTIVE=postgres)
#
# 1) Create database:  CREATE DATABASE disaster_db;
# 2) Provide credentials via environment variables / a local .env file.
#
# SECRETS & API KEYS: no credentials are hardcoded here. Everything is
# read from environment variables (or the optional local .env file, see
# application.properties). MANDATORY here: JWT_SECRET (>= 32 bytes) and
# a valid DATABASE_URL (or DB_HOST/DB_PORT/DB_NAME). The server fails
# fast at startup when mandatory configuration is missing.
# =====================================================================

# Load optional local .env file (KEY=VALUE lines). Missing file is fine.
spring.config.import=optional:file:.env[.properties]

# --- Database (PostgreSQL) ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:disaster_db}}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD:postgres}}

# --- Connection pooling (HikariCP) ---
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=DisasterHikariPool
spring.datasource.hikari.connection-init-sql=SELECT 1

# --- JPA / Flyway ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT ---
# Production requires an explicit JWT_SECRET environment variable. The server
# fails fast at startup if it is missing or weaker than 256 bits.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
# Reserved for a future refresh-token flow.
app.jwt.refresh-secret=${JWT_REFRESH_SECRET:}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# --- Security hardening ---
app.security.h2-console-enabled=false
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.lockout-minutes=${LOGIN_LOCKOUT_MINUTES:15}
app.security.rate-limit.max-per-minute=${RATE_LIMIT_MAX_PER_MINUTE:60}
app.security.rate-limit.public-max-per-minute=${RATE_LIMIT_PUBLIC_MAX_PER_MINUTE:20}

# --- File upload limits (attachments) ---
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# --- CORS ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# --- Weather API (blank = use mock provider) ---
weather.api-key=${OPENWEATHER_API_KEY:${WEATHER_API_KEY:}}
weather.api-url=${OPENWEATHER_API_URL:https://api.openweathermap.org/data/2.5/weather}

# --- AI providers (blank = local deterministic AI engine) ---
ai.gemini.api-key=${GOOGLE_GEMINI_API_KEY:}
ai.groq.api-key=${GROQ_API_KEY:}

# --- Routing / Route Optimization (blank key = Haversine offline fallback) ---
app.routing.provider=${ROUTING_PROVIDER:openrouteservice}
app.routing.openrouteservice.api-key=${OPENROUTESERVICE_API_KEY:}
app.routing.openrouteservice.url=${OPENROUTESERVICE_API_URL:https://api.openrouteservice.org/v2/directions}
app.routing.openrouteservice.timeout-ms=${OPENROUTESERVICE_TIMEOUT_MS:8000}
app.routing.openrouteservice.retry-count=${OPENROUTESERVICE_RETRY_COUNT:2}
app.routing.google.api-key=${GOOGLE_MAPS_API_KEY:}
app.routing.mapbox.access-token=${MAPBOX_ACCESS_TOKEN:}
app.routing.cache.ttl-minutes=${ROUTING_CACHE_TTL_MINUTES:10}
app.routing.normal-speed-kmph=${ROUTING_NORMAL_SPEED_KMPH:40}
app.routing.emergency-speed-kmph=${ROUTING_EMERGENCY_SPEED_KMPH:55}

# --- Notification providers (blank = use mock provider) ---
notification.firebase.server-key=${FIREBASE_SERVER_KEY:}
notification.brevo.api-key=${BREVO_API_KEY:}

# --- Mail (blank = use mock provider) ---
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

# --- Email (Resend REST API; blank API key = mock email provider) ---
email.resend.api-key=${RESEND_API_KEY:}
email.resend.from-email=${RESEND_FROM_EMAIL:}
email.resend.from-name=${RESEND_FROM_NAME:AI Disaster Management System}
email.resend.api-url=${RESEND_API_URL:https://api.resend.com/emails}
email.resend.timeout-ms=${RESEND_TIMEOUT_MS:8000}
email.resend.retry-count=${RESEND_RETRY_COUNT:2}
email.resend.retry-backoff-ms=${RESEND_RETRY_BACKOFF_MS:500}
email.emergency-contact=${EMAIL_EMERGENCY_CONTACT:112}

# --- SMS / Twilio (blank = use mock provider) ---
notification.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
notification.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
notification.twilio.phone-number=${TWILIO_PHONE_NUMBER:${TWILIO_FROM_NUMBER:}}

# --- Hazard data feeds (all optional) ---
app.api.openaq.api-key=${OPENAQ_API_KEY:}
app.api.usgs.api-url=${USGS_API_URL:https://earthquake.usgs.gov/fdsnws/event/1/query}
app.api.nasa-firms.api-key=${NASA_FIRMS_API_KEY:}

# --- Earthquake monitoring (USGS GeoJSON feed) ---
# Public feed; no API key required. Blank url = empty result set (never crashes).
earthquake.api.url=${USGS_EARTHQUAKE_API:https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson}
# Refresh interval for the scheduled USGS fetch, in milliseconds (default 5 min).
earthquake.refresh.interval=${EARTHQUAKE_REFRESH_INTERVAL_MS:300000}
# How long a successful fetch is served from the in-memory cache, in minutes.
earthquake.cache.minutes=${EARTHQUAKE_CACHE_MINUTES:5}

# --- NASA EONET events (public natural-disaster feed) ---
# Public feed; no API key required. Blank url = empty result set (never crashes).
eonet.api.url=${NASA_EONET_API:https://eonet.gsfc.nasa.gov/api/v3/events}
# Refresh interval for the scheduled NASA EONET fetch, in milliseconds (default 10 min).
eonet.refresh.interval=${EONET_REFRESH_INTERVAL_MS:600000}
# How long a successful fetch is served from the in-memory cache, in minutes.
eonet.cache.minutes=${EONET_CACHE_MINUTES:10}

# --- Fire monitoring (NASA FIRMS active-fire feed) ---
# Requires NASA_FIRMS_API_KEY (see app.api.nasa-firms.api-key above).
# Missing key = empty result set (never crashes).
fire.api.url=${NASA_FIRMS_API_URL:https://firms.modaps.eosdis.nasa.gov/api/area/csv}
# Refresh interval for the scheduled NASA FIRMS fetch, in milliseconds (default 10 min).
fire.refresh.interval=${FIRE_REFRESH_INTERVAL_MS:600000}
# How long a successful fetch is served from the in-memory cache, in minutes.
fire.cache.minutes=${FIRE_CACHE_MINUTES:10}
# Comma-separated FIRMS datasets to poll: VIIRS_SNPP_NRT, VIIRS_NOAA20_NRT, VIIRS_NOAA21_NRT, MODIS_NRT.
fire.sources=${NASA_FIRMS_SOURCES:VIIRS_SNPP_NRT,MODIS_NRT}
# FIRMS area-query window (days back / window width in days).
fire.day=${NASA_FIRMS_DAY:1}
fire.day-range=${NASA_FIRMS_DAY_RANGE:1}

# --- SpringDoc / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# --- Logging ---
logging.level.com.disaster=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=INFO
