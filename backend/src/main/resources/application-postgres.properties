# =====================================================================
# Production profile - PostgreSQL
# Activate with:  mvn spring-boot:run -Dspring-boot.run.profiles=postgres
#   (or set environment variable SPRING_PROFILES_ACTIVE=postgres)
#
# 1) Create database:  CREATE DATABASE disaster_db;
# 2) Configure credentials below (or via env vars).
# =====================================================================

# --- Database (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:disaster_db}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# --- Connection pooling (HikariCP) ---
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=DisasterHikariPool
spring.datasource.hikari.connection-init-sql=SELECT 1

# --- JPA / Flyway ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT ---
# Production requires an explicit JWT_SECRET environment variable. The server
# fails fast at startup if it is missing or weaker than 256 bits.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# --- Security hardening ---
app.security.h2-console-enabled=false
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.lockout-minutes=${LOGIN_LOCKOUT_MINUTES:15}
app.security.rate-limit.max-per-minute=${RATE_LIMIT_MAX_PER_MINUTE:60}
app.security.rate-limit.public-max-per-minute=${RATE_LIMIT_PUBLIC_MAX_PER_MINUTE:20}

# --- File upload limits (attachments) ---
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# --- CORS ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# --- Weather API (blank = use mock provider) ---
weather.api.key=${WEATHER_API_KEY:}
weather.api.url=https://api.openweathermap.org/data/2.5/weather

# --- Mail (blank = use mock provider) ---
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- SMS (blank = use mock provider) ---
sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
sms.twilio.from-number=${TWILIO_FROM_NUMBER:}

# --- SpringDoc / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# --- Logging ---
logging.level.com.disaster=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=INFO
