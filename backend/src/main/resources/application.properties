# =====================================================================
# AI Disaster Management System - default profile (DEMO / H2 in-memory)
# Run:  mvn spring-boot:run
# Swagger UI: http://localhost:8080/swagger-ui.html
# =====================================================================

server.port=8080

# --- Database (H2 in-memory, PostgreSQL compatibility mode) ---
spring.datasource.url=jdbc:h2:mem:disasterdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Connection pooling (HikariCP) ---
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=DisasterHikariPool

# --- JPA / Flyway ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway runs V1__init_schema.sql on startup (both H2 and PostgreSQL)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# --- JWT ---
# Override JWT_SECRET in any real deployment. The default below is demo-only.
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A47}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000
app.frontend.url=http://localhost:5173

# --- Security hardening ---
# H2 web console is dev-only. Run with --spring.profiles.active=dev to expose it.
app.security.h2-console-enabled=false
app.security.login.max-attempts=5
app.security.login.lockout-minutes=15
app.security.rate-limit.max-per-minute=60
app.security.rate-limit.public-max-per-minute=20

# --- File upload limits (attachments) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# --- CORS ---
# The Vite dev server (5173) and the built-app preview server (4173) are both
# first-party frontends. The browser sends an Origin header on POST requests,
# so the backend must allow every port the login page is served from,
# otherwise Spring Security rejects the request with HTTP 403.
app.cors.allowed-origins=http://localhost:5173,http://localhost:4173

# --- Weather API (blank = use mock provider) ---
weather.api.key=
weather.api.url=https://api.openweathermap.org/data/2.5/weather

# --- Routing / Route Optimization (blank key = Haversine offline fallback) ---
# provider: openrouteservice (default), google|google-maps, mapbox, haversine
app.routing.provider=openrouteservice
app.routing.openrouteservice.api-key=
app.routing.openrouteservice.url=https://api.openrouteservice.org/v2/directions
app.routing.openrouteservice.timeout-ms=8000
app.routing.google.api-key=
app.routing.mapbox.access-token=
app.routing.cache.ttl-minutes=10
app.routing.normal-speed-kmph=40
app.routing.emergency-speed-kmph=55

# --- Mail (blank = use mock provider) ---
spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- SMS (blank = use mock provider) ---
sms.twilio.account-sid=
sms.twilio.auth-token=
sms.twilio.from-number=

# --- SpringDoc / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# --- Logging ---
logging.level.com.disaster=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=INFO
