# =====================================================================
# AI Disaster Management System - DEV profile
# Enables developer conveniences that must stay OFF in production:
#   * H2 web console at /h2-console (JDBC URL: jdbc:h2:mem:disasterdb)
#   * More verbose logging
# Run with:  mvn spring-boot:run -Dspring-boot.run.profiles=dev
# =====================================================================

# --- H2 Console (dev only) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- Security (relaxed only for local development) ---
app.security.h2-console-enabled=true

# --- Logging ---
logging.level.com.disaster=DEBUG
logging.level.org.springframework.web=INFO
